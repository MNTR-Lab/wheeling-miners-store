name: Shopify draft seat staging (manual only)
on:
  workflow_dispatch:
    inputs:
      section:
        description: 'Approved 3-digit section, e.g. 105'
        required: true
        type: string
      operation:
        description: 'Configure options first; then create one variant batch'
        required: true
        type: choice
        options: [options, variants]
      part:
        description: 'Batch number (1 for options)'
        required: true
        default: '1'
        type: string
      action:
        description: 'dry-run first; execute only after reviewing results'
        required: true
        type: choice
        options: [dry-run, execute]
permissions:
  contents: read
concurrency:
  group: shopify-season-seat-staging
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHOPIFY_SHOP_DOMAIN: ${{ secrets.SHOPIFY_SHOP_DOMAIN }}
      SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
      SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
      WM_SEAT_MAP_PRICE_APPROVED: 'YES'
      WM_SEASON_WRITE_CONFIRM: I_APPROVE_DRAFT_SECTION_${{ inputs.section }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate requested section and batch
        env:
          SECTION: ${{ inputs.section }}
          PART: ${{ inputs.part }}
        shell: bash
        run: |
          [[ "$SECTION" =~ ^[0-9]{3}$ ]] || exit 1
          [[ "$PART" =~ ^[0-9]+$ ]] || exit 1
      - name: Get short-lived Shopify Admin API token
        run: node tools/get-shopify-admin-token.mjs
      - name: Inspect or stage one approved section
        env:
          SECTION: ${{ inputs.section }}
          PART: ${{ inputs.part }}
          OPERATION: ${{ inputs.operation }}
          ACTION: ${{ inputs.action }}
        run: node tools/run-approved-seat-section.mjs "$OPERATION" "$SECTION" "$PART" "$ACTION"
