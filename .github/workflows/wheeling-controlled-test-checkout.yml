name: Wheeling controlled test checkout (test store only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Create isolated test reservation and Shopify cart
        env:
          CLOUDFLARE_TEST_API_TOKEN: ${{ secrets.CLOUDFLARE_TEST_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WM_TEST_SEAT_ADMIN_TOKEN: ${{ secrets.WM_TEST_SEAT_ADMIN_TOKEN }}
        run: node scripts/wm-test-checkout.mjs
