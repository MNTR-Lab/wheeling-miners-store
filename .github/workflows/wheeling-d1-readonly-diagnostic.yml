name: Wheeling D1 read-only diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify Cloudflare access without database changes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          const token=process.env.CLOUDFLARE_API_TOKEN?.trim();
          const account=process.env.CLOUDFLARE_ACCOUNT_ID?.trim();
          const expectedAccount='0b83177a971bd8fcfad88ed4e531eb50';
          const database='221e3797-3ea2-477d-9a7f-7dfded620547';
          if(!token) throw Error('GITHUB_SECRET_MISSING: CLOUDFLARE_API_TOKEN');
          if(!account) throw Error('GITHUB_SECRET_MISSING: CLOUDFLARE_ACCOUNT_ID');
          if(account!==expectedAccount) throw Error('WRONG_GITHUB_ACCOUNT_ID: expected Cloudflare account for Wheeling database. Update CLOUDFLARE_ACCOUNT_ID.');
          console.log('ACCOUNT_ID_MATCH: YES');
          async function request(label,path,options={}){
            const response=await fetch(`https://api.cloudflare.com/client/v4${path}`,{
              ...options,headers:{Authorization:`Bearer ${token}`,...options.headers}
            });
            const body=await response.json().catch(()=>({}));
            const errors=(body.errors||[]).map(e=>({code:e.code,message:String(e.message||'').slice(0,200)}));
            console.log(`${label}: HTTP ${response.status}; success=${body.success===true}; errors=${JSON.stringify(errors)}`);
            return {ok:response.ok&&body.success===true,body};
          }
          const auth=await request('TOKEN_VERIFY','/user/tokens/verify');
          if(!auth.ok) throw Error('TOKEN_NOT_ACCEPTED');
          console.log('TOKEN_VERIFY_PASSED');
          const metadata=await request('D1_METADATA',`/accounts/${account}/d1/database/${database}`);
          if(!metadata.ok) throw Error('TOKEN_VALID_BUT_D1_METADATA_DENIED: check token account scope and D1 permission');
          console.log('D1_DATABASE_NAME:',metadata.body.result?.name);
          if(metadata.body.result?.name!=='wheeling-miners-seats') throw Error('UNEXPECTED_DATABASE');
          const query=await request('D1_READ_ONLY',`/accounts/${account}/d1/database/${database}/query`,{
            method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({sql:"SELECT status, COUNT(*) AS n, COUNT(shopify_variant_id) AS mapped FROM seats GROUP BY status"})
          });
          if(!query.ok) throw Error('TOKEN_VALID_METADATA_OK_BUT_D1_QUERY_DENIED');
          const rows=query.body.result?.[0]?.results;
          console.log('SEAT_STATUS_COUNTS:',JSON.stringify(rows));
          if(!Array.isArray(rows)) throw Error('UNEXPECTED_QUERY_RESPONSE');
          console.log('READ_ONLY_ACCESS_PASSED');
          JS
