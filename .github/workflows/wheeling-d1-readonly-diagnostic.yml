name: Wheeling D1 read-only diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Cloudflare credentials are configured (without displaying values)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          echo 'Cloudflare secrets are present'
      - name: Query production D1 READ ONLY and diagnose response shape
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npx --yes wrangler@4 d1 execute wheeling-miners-seats --remote --command "SELECT COUNT(*) AS n,COUNT(shopify_variant_id) AS mapped,SUM(status='UNRELEASED') AS unreleased FROM seats" --json > /tmp/wheeling-d1-readonly.json 2>/tmp/wheeling-d1-error.log
          status=$?
          set -e
          echo "Wrangler exit code: $status"
          if [ "$status" -ne 0 ]; then
            echo 'Wrangler command failed. Diagnostic stderr (secrets masked by GitHub):'
            sed -E 's/(Bearer[[:space:]]+)[^[:space:]]+/\1[REDACTED]/Ig' /tmp/wheeling-d1-error.log | tail -n 35
            exit 1
          fi
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const raw=readFileSync('/tmp/wheeling-d1-readonly.json','utf8');
          let data;
          try {data=JSON.parse(raw);} catch(e) {console.error('Wrangler returned non-JSON output; first 300 chars:',raw.slice(0,300));process.exit(1);}
          console.log('Response top-level:',Array.isArray(data)?'array':typeof data);
          console.log('Top-level keys:',Object.keys(data).join(', '));
          const candidates=[data?.[0]?.results?.[0],data?.results?.[0],data?.result?.[0]?.results?.[0]];
          const row=candidates.find(x=>x&&typeof x==='object'&&'n' in x);
          if(!row){console.error('Could not find seat counts in Wrangler JSON; nested keys:',Object.keys(data?.[0]??{}));process.exit(1);}
          console.log('D1 counts:',JSON.stringify({n:row.n,mapped:row.mapped,unreleased:row.unreleased}));
          if(Number(row.n)!==3737||Number(row.mapped)!==0||Number(row.unreleased)!==3737){console.error('Unexpected database state; STOP before mapping');process.exit(1);}
          console.log('READ_ONLY_D1_PREFLIGHT_PASSED; NO SEATS MODIFIED');
          JS
