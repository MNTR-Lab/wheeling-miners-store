name: Wheeling isolated end-to-end paid Worker test
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wheeling-isolated-paid-worker
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TEST_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WM_TEST_WEBHOOK_SECRET: ${{ secrets.WM_TEST_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check credentials and environment
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$WM_TEST_WEBHOOK_SECRET"
          test "$CLOUDFLARE_ACCOUNT_ID" = '0b83177a971bd8fcfad88ed4e531eb50'
          node scripts/wm-e2e-paid-worker.mjs preflight
      - name: Execute isolated end-to-end test
        run: node scripts/wm-e2e-paid-worker.mjs run
