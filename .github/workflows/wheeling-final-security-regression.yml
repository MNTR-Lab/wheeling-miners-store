name: Wheeling final seat security regression
on:
  push:
    branches: [main]
    paths:
      - 'src/seat-*.js'
      - 'tests/seat-final-security-regression.test.mjs'
      - '.github/workflows/wheeling-final-security-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Final security regression
        run: node --test tests/seat-final-security-regression.test.mjs
      - name: Existing full seat test suite
        run: node --test tests/*.test.mjs
