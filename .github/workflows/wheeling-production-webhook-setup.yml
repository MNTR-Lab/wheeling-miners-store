name: Wheeling production paid webhook setup (sales stay closed)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wheeling-production-paid-webhook-setup
  cancel-in-progress: false
jobs:
  setup-webhook:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TEST_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WM_SHOPIFY_PRODUCTION_STORE_DOMAIN: ${{ vars.WM_SHOPIFY_PRODUCTION_STORE_DOMAIN }}
      WM_SHOPIFY_CLIENT_ID: ${{ secrets.WM_SHOPIFY_CLIENT_ID }}
      WM_SHOPIFY_CLIENT_SECRET: ${{ secrets.WM_SHOPIFY_CLIENT_SECRET }}
      WM_WEBHOOK_SIGNING_SECRET: ${{ secrets.WM_SHOPIFY_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run production payment regression tests offline
        run: node --test tests/seat-production-payment-integration.test.mjs tests/seat-production-payment-runtime-audit.test.mjs
      - name: Require locked production sales and valid signed routing before registration
        run: node scripts/wm-production-payment-runtime-audit.mjs
      - name: Register missing production paid webhook without changing sales or inventory
        env:
          WM_WEBHOOK_ACTION: register
        run: node scripts/wm-production-webhook-subscription.mjs
      - name: Independently re-read and verify the production paid webhook
        env:
          WM_WEBHOOK_ACTION: verify
        run: node scripts/wm-production-webhook-subscription.mjs
