name: Wheeling REAL TEST D1 fulfillment probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify guarded fulfillment SQL against actual TEST D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TEST_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {randomUUID} from 'node:crypto';
          const ACCOUNT='0b83177a971bd8fcfad88ed4e531eb50';
          const DB='2a06b7a7-e833-4a01-8667-2f6388dc0ee0';
          assert.equal(process.env.CLOUDFLARE_ACCOUNT_ID,ACCOUNT,'Wrong account');
          assert.ok(process.env.CLOUDFLARE_API_TOKEN,'Missing TEST token');
          const endpoint=`https://api.cloudflare.com/client/v4/accounts/${ACCOUNT}/d1/database/${DB}/query`;
          async function query(sql,params=[]){
            const res=await fetch(endpoint,{method:'POST',headers:{Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,'Content-Type':'application/json'},body:JSON.stringify({sql,params})});
            const json=await res.json();
            if(!res.ok||json.success!==true||json.result?.[0]?.success!==true)throw Error(`TEST D1 query failed: ${JSON.stringify(json.errors??json.result?.[0]?.error??'unknown')}`);
            return json.result[0];
          }
          const uid=randomUUID().replaceAll('-','');
          const rid=`wm_probe_${uid}`;
          const sku='WM-ST-999-Z-99';
          const variant=`gid://shopify/ProductVariant/${BigInt('0x'+uid.slice(0,12))}`;
          const orderId=String(BigInt('0x'+uid.slice(12,24)));
          let createdReservation=false,createdSeat=false;
          try{
            const original=await query('SELECT sku FROM seats WHERE sku=?',[sku]);
            assert.equal(original.results.length,0,'Probe SKU already exists; refusing test');
            const before=await query("SELECT sku,status,shopify_order_id FROM seats WHERE sku='WM-ST-105-B-01'");
            assert.equal(before.results.length,1);
            assert.equal(before.results[0].status,'SOLD');
            assert.equal(String(before.results[0].shopify_order_id),'18969898221625');
            const now=Date.now();
            await query("INSERT INTO reservations (id,status,created_at,checkout_nonce,expires_at,shopify_order_id) VALUES (?,'CHECKOUT_PENDING',?,?,?,NULL)",[rid,now,`wm_probe_nonce_${uid}`,now+3600000]);
            createdReservation=true;
            await query("INSERT INTO seats (sku,section,row_label,seat_number,price_cents,status,hold_id,hold_expires_at,shopify_order_id,shopify_variant_id) VALUES (?,'TEST','Z',99,100,'HELD',?,?,NULL,?)",[sku,rid,now+3600000,variant]);
            createdSeat=true;
            await query('INSERT INTO reservation_seats (reservation_id,seat_sku,shopify_variant_id) VALUES (?,?,?)',[rid,sku,variant]);
            const seat=await query("UPDATE seats SET status='SOLD',shopify_order_id=?,hold_id=NULL,hold_expires_at=NULL,updated_at=CURRENT_TIMESTAMP WHERE sku=? AND status='HELD' AND hold_id=? AND shopify_order_id IS NULL AND shopify_variant_id=?",[orderId,sku,rid,variant]);
            assert.equal(seat.meta.changes,1,'Seat transition did not update exactly one row');
            const reservation=await query("UPDATE reservations SET status='CONFIRMED',shopify_order_id=? WHERE id=? AND status IN ('HELD','CHECKOUT_PENDING') AND shopify_order_id IS NULL",[orderId,rid]);
            assert.equal(reservation.meta.changes,1,'Reservation transition did not update exactly one row');
            const finalSeat=(await query('SELECT status,shopify_order_id,hold_id FROM seats WHERE sku=?',[sku])).results[0];
            const finalReservation=(await query('SELECT status,shopify_order_id FROM reservations WHERE id=?',[rid])).results[0];
            assert.deepEqual([finalSeat.status,String(finalSeat.shopify_order_id),finalSeat.hold_id],['SOLD',orderId,null]);
            assert.deepEqual([finalReservation.status,String(finalReservation.shopify_order_id)],['CONFIRMED',orderId]);
            const replay=await query("UPDATE seats SET status='SOLD',shopify_order_id=?,hold_id=NULL,hold_expires_at=NULL WHERE sku=? AND status='HELD' AND hold_id=? AND shopify_order_id IS NULL AND shopify_variant_id=?",[orderId,sku,rid,variant]);
            assert.equal(replay.meta.changes,0,'Replay unexpectedly wrote seat');
            const competitor=await query("UPDATE seats SET status='SOLD',shopify_order_id=? WHERE sku=? AND status='HELD' AND hold_id=? AND shopify_order_id IS NULL AND shopify_variant_id=?",[String(BigInt(orderId)+1n),sku,rid,variant]);
            assert.equal(competitor.meta.changes,0,'Competing order unexpectedly wrote seat');
            console.log('PASS: Real TEST D1 seat HELD -> SOLD');
            console.log('PASS: Real TEST D1 reservation CHECKOUT_PENDING -> CONFIRMED');
            console.log('PASS: Replay and competing order rejected by guarded SQL');
          } finally {
            // Cleanup is restricted to this run's random reservation and fixed reserved test SKU.
            try{if(createdReservation)await query('DELETE FROM reservation_seats WHERE reservation_id=?',[rid]);}catch(e){console.error('Cleanup link failed:',e.message);process.exitCode=1;}
            try{if(createdSeat)await query('DELETE FROM seats WHERE sku=? AND section=\'TEST\' AND row_label=\'Z\' AND seat_number=99',[sku]);}catch(e){console.error('Cleanup seat failed:',e.message);process.exitCode=1;}
            try{if(createdReservation)await query('DELETE FROM reservations WHERE id=?',[rid]);}catch(e){console.error('Cleanup reservation failed:',e.message);process.exitCode=1;}
          }
          const after=await query("SELECT sku,status,shopify_order_id FROM seats WHERE sku='WM-ST-105-B-01'");
          assert.deepEqual(after.results,[{sku:'WM-ST-105-B-01',status:'SOLD',shopify_order_id:'18969898221625'}]);
          console.log('PASS: Existing Shopify #1001 seat untouched; probe records cleaned');
          console.log('NOTE: This tests real D1 SQL transitions, NOT the deployed webhook or atomic Worker batch.');
          JS
