name: Wheeling TEST inventory migration preflight (offline only)
on:
  workflow_dispatch:
  push:
    paths:
      - 'data/migrations/TEST-inventory-candidate.sql'
      - 'tools/check-test-inventory-candidate.py'
      - '.github/workflows/wheeling-test-inventory-preflight.yml'
permissions:
  contents: read
jobs:
  offline-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify proposed inventory migration using disposable in-memory SQLite
        run: python3 tools/check-test-inventory-candidate.py
