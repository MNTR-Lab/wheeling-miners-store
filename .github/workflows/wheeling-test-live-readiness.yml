name: Wheeling TEST live inventory and selector readiness (read only)
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/check-live-seat-readiness.mjs'
      - '.github/workflows/wheeling-test-live-readiness.yml'
permissions:
  contents: read
jobs:
  live-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify TEST public seat endpoints, admin isolation, and selector (NO WRITES)
        run: node tools/check-live-seat-readiness.mjs
