name: Wheeling TEST reservation refresh (manual)
on:
  workflow_dispatch:
    inputs:
      approval:
        description: Type REFRESH-TEST-RESERVATION
        required: true
        type: string
permissions:
  contents: read
jobs:
  test:
    if: ${{ inputs.approval == 'REFRESH-TEST-RESERVATION' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify isolated TEST config
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const c=JSON.parse(readFileSync('wrangler.test.jsonc','utf8'));
          if(c.name!=='wheeling-miners-store-test'||c.main!=='src/worker.js')throw Error('Wrong worker');
          if(c.vars?.WM_ENVIRONMENT!=='TEST'||c.vars?.SHOPIFY_STORE_DOMAIN!=='wheeling-miners-ticket-testing.myshopify.com'||c.vars?.SEAT_CONTROLLED_CART_ENABLED!=='true')throw Error('Wrong TEST vars');
          if(c.vars?.SEAT_PAID_FULFILLMENT_ENABLED==='true')throw Error('Fulfillment enabled');
          if(c.d1_databases?.length!==1||c.d1_databases[0].binding!=='SEAT_DB'||c.d1_databases[0].database_name!=='wheeling-miners-seats-test'||c.d1_databases[0].database_id!=='2a06b7a7-e833-4a01-8667-2f6388dc0ee0')throw Error('Wrong D1');
          JS
      - name: Validate fixture SQL
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const sql=readFileSync('data/staging/refresh-test-cart-fixture.sql','utf8');
          if(/\b(BEGIN|COMMIT|ROLLBACK|DELETE|DROP|INSERT|ALTER)\b/i.test(sql.replace(/^--.*$/gm,'')))throw Error('Unsafe SQL');
          if(!sql.includes('wm_test_reservation_105_B_01')||!sql.includes('WM-ST-105-B-01'))throw Error('Wrong fixture');
          JS
      - name: Refresh existing synthetic TEST hold
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TEST_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || exit 1
          test "$CLOUDFLARE_ACCOUNT_ID" = '0b83177a971bd8fcfad88ed4e531eb50' || exit 1
          npx --yes wrangler@4 d1 execute wheeling-miners-seats-test --remote --config wrangler.test.jsonc --file data/staging/refresh-test-cart-fixture.sql
      - name: Verify fresh matching expiry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TEST_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || exit 1
          test "$CLOUDFLARE_ACCOUNT_ID" = '0b83177a971bd8fcfad88ed4e531eb50' || exit 1
          npx --yes wrangler@4 d1 execute wheeling-miners-seats-test --remote --config wrangler.test.jsonc --command "SELECT CASE WHEN COUNT(*)=1 AND MIN(r.expires_at)=MIN(s.hold_expires_at) AND MIN(r.expires_at)>(CAST(strftime('%s','now') AS INTEGER)*1000+3000000) THEN 1 ELSE 0 END AS verified FROM reservations r JOIN seats s ON s.hold_id=r.id WHERE r.id='wm_test_reservation_105_B_01' AND r.status='HELD' AND s.status='HELD' AND s.shopify_variant_id='gid://shopify/ProductVariant/50931850575929';" > verify.txt
          cat verify.txt
          grep -Eq 'verified[^0-9]*1' verify.txt || exit 1
      - name: Verify public routes locked
        run: |
          node --input-type=module <<'JS'
          const base='https://wheeling-miners-store-test.bikard.workers.dev';
          const r=await fetch(base+'/api/seats/status');const d=await r.json();
          if(!r.ok||d.checkout_enabled!==false||d.holds_enabled!==false)throw Error('Public checkout not locked');
          for(const p of ['/api/seats/hold','/api/seats/checkout']){
            const x=await fetch(base+p,{method:'POST',headers:{'content-type':'application/json'},body:'{}'});
            if(x.status!==423)throw Error(p+' not locked');
          }
          JS
