name: Wheeling TEST seat fixture (manual)
on:
  workflow_dispatch:
    inputs:
      approval:
        description: 'Type STAGE-TEST-SEAT to insert ONE synthetic test seat; public checkout stays off'
        required: true
        type: string
permissions:
  contents: read
jobs:
  fixture:
    if: ${{ inputs.approval == 'STAGE-TEST-SEAT' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify isolated environment and fixture
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const c=JSON.parse(readFileSync('wrangler.test.jsonc','utf8'));
          if(c.name!=='wheeling-miners-store-test'||c.vars?.WM_ENVIRONMENT!=='TEST'||c.vars?.SEAT_CONTROLLED_CART_ENABLED!=='false'||c.vars?.SHOPIFY_STORE_DOMAIN!=='wheeling-miners-ticket-testing.myshopify.com')throw Error('Unsafe Worker configuration');
          if(c.d1_databases?.length!==1||c.d1_databases[0].database_id!=='2a06b7a7-e833-4a01-8667-2f6388dc0ee0')throw Error('Wrong D1 target');
          const sql=readFileSync('data/staging/test-cart-fixture.sql','utf8');
          if(!sql.includes('50931850575929')||!sql.includes('WM-ST-105-B-01')||/\b(DELETE|DROP|UPDATE|ALTER)\b/i.test(sql.replace(/^--.*$/gm,'')))throw Error('Unexpected fixture SQL');
          console.log('Test-only target verified; no checkout flags modified');
          JS
      - name: Verify test D1 is empty before fixture
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TEST_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || exit 1
          test "$CLOUDFLARE_ACCOUNT_ID" = '0b83177a971bd8fcfad88ed4e531eb50' || exit 1
          npx --yes wrangler@4 d1 execute wheeling-miners-seats-test --remote --config wrangler.test.jsonc --command "SELECT COUNT(*) AS existing_seats FROM seats;"
      - name: Stage synthetic seat in TEST D1 only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TEST_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 execute wheeling-miners-seats-test --remote --config wrangler.test.jsonc --file data/staging/test-cart-fixture.sql
      - name: Verify synthetic seat and reservation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TEST_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 d1 execute wheeling-miners-seats-test --remote --config wrangler.test.jsonc --command "SELECT sku,status,shopify_variant_id FROM seats WHERE sku='WM-ST-105-B-01';"
          npx --yes wrangler@4 d1 execute wheeling-miners-seats-test --remote --config wrangler.test.jsonc --command "SELECT id,status FROM reservations WHERE id='wm_test_reservation_105_B_01';"
