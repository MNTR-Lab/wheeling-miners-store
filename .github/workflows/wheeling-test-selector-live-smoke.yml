name: Wheeling TEST selector deployed smoke (read only)
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/check-test-selector-live.mjs'
      - '.github/workflows/wheeling-test-selector-live-smoke.yml'
  workflow_run:
    workflows:
      - 'Wheeling TEST Worker deployment (guarded)'
    types:
      - completed
permissions:
  contents: read
jobs:
  deployed-selector-smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live TEST selector and locked checkout
        run: node tools/check-test-selector-live.mjs
