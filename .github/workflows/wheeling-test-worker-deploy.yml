name: Wheeling TEST Worker deployment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy-test-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify test-only configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing Cloudflare token'; exit 1; }
          test "$CLOUDFLARE_ACCOUNT_ID" = '0b83177a971bd8fcfad88ed4e531eb50' || { echo 'Cloudflare account mismatch'; exit 1; }
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const config=JSON.parse(readFileSync('wrangler.test.jsonc','utf8'));
          if(config.name!=='wheeling-miners-store-test'||config.main!=='src/worker.js')throw Error('Unexpected Worker');
          if(config.d1_databases?.length!==1||config.d1_databases[0].binding!=='SEAT_DB'||config.d1_databases[0].database_id!=='2a06b7a7-e833-4a01-8667-2f6388dc0ee0'||config.d1_databases[0].database_name!=='wheeling-miners-seats-test')throw Error('Wrong database');
          if(config.vars?.SEAT_CONTROLLED_CART_ENABLED!=='false'||config.vars?.WM_ENVIRONMENT!=='TEST')throw Error('Unsafe flags');
          if(config.vars?.SEAT_PAID_FULFILLMENT_ENABLED==='true')throw Error('Fulfillment must be disabled');
          console.log('Test Worker and database isolation verified.');
          JS
      - name: Verify test schema exists before deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 d1 execute wheeling-miners-seats-test --remote --config wrangler.test.jsonc --command "SELECT COUNT(*) AS n FROM seats;"
          npx --yes wrangler@4 d1 execute wheeling-miners-seats-test --remote --config wrangler.test.jsonc --command "SELECT COUNT(*) AS n FROM reservations;"
          npx --yes wrangler@4 d1 execute wheeling-miners-seats-test --remote --config wrangler.test.jsonc --command "SELECT COUNT(*) AS n FROM reservation_seats;"
      - name: Deploy isolated test Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.test.jsonc
      - name: Verify test endpoint and locked checkout
        run: |
          node --input-type=module <<'JS'
          const base='https://wheeling-miners-store-test.bikard.workers.dev';
          const status=await fetch(base+'/api/seats/status');
          const body=await status.json();
          if(!status.ok||body.mode!=='STAGING'||body.checkout_enabled!==false||body.holds_enabled!==false)throw Error('Test status failed: '+JSON.stringify(body));
          const hold=await fetch(base+'/api/seats/hold',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({skus:['WM-ST-105-B-01']})});
          if(hold.status!==423)throw Error('Public holds are not locked: '+hold.status);
          const checkout=await fetch(base+'/api/seats/checkout',{method:'POST',headers:{'content-type':'application/json'},body:'{}'});
          if(checkout.status!==423)throw Error('Public checkout is not locked: '+checkout.status);
          console.log('TEST_WORKER_DEPLOYED',base);
          console.log('PUBLIC_HOLDS_AND_CHECKOUT_LOCKED');
          JS
