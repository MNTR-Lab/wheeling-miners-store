name: Wheeling TEST Worker deployment (guarded)
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'assets/seat-live.js'
      - 'seat-selector.html'
      - 'seat-admin.html'
      - 'tests/admin-readiness-schema.test.mjs'
      - 'tests/seat-live-overlay-contract.test.mjs'
      - 'tests/seat-catalog-audit.test.mjs'
      - 'tools/check-test-deployment.mjs'
      - 'tools/check-full-test-inventory.mjs'
      - 'wrangler.test.jsonc'
      - '.github/workflows/wheeling-test-worker-deploy.yml'
permissions:
  contents: read
concurrency:
  group: wheeling-test-worker-deployment
  cancel-in-progress: false
jobs:
  deploy-test-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check TEST-only config and bindings
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const c=JSON.parse(readFileSync('wrangler.test.jsonc','utf8'));
          if(c.name!=='wheeling-miners-store-test'||c.main!=='src/worker.js')throw Error('Wrong TEST Worker');
          if(c.vars?.WM_ENVIRONMENT!=='TEST'||c.vars?.SHOPIFY_STORE_DOMAIN!=='wheeling-miners-ticket-testing.myshopify.com')throw Error('Wrong Shopify environment');
          if(c.vars?.SEAT_CONTROLLED_CART_ENABLED!=='true'||c.vars?.SEAT_PAID_FULFILLMENT_ENABLED!=='true'||c.vars?.SEAT_TEST_PAID_ORDER_ID!=='18970068058169')throw Error('Unexpected TEST feature flags');
          if(c.d1_databases?.length!==1||c.d1_databases[0].binding!=='SEAT_DB'||c.d1_databases[0].database_name!=='wheeling-miners-seats-test'||c.d1_databases[0].database_id!=='2a06b7a7-e833-4a01-8667-2f6388dc0ee0')throw Error('Wrong TEST D1');
          JS
      - name: Validate local admin, selector and catalog regression tests
        run: node --test tests/admin-readiness-schema.test.mjs tests/seat-live-overlay-contract.test.mjs tests/seat-catalog-audit.test.mjs
      - name: Validate TEST inventory is staged (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TEST_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || exit 1
          test "$CLOUDFLARE_ACCOUNT_ID" = '0b83177a971bd8fcfad88ed4e531eb50' || exit 1
          npx --yes wrangler@4 d1 execute wheeling-miners-seats-test --remote --config wrangler.test.jsonc --command "SELECT status,COUNT(*) AS n FROM seats GROUP BY status;"
          npx --yes wrangler@4 d1 execute wheeling-miners-seats-test --remote --config wrangler.test.jsonc --command "SELECT COUNT(*) AS total,COUNT(DISTINCT section) AS sections,COUNT(DISTINCT shopify_variant_id) AS mapped FROM seats;"
      - name: Deploy TEST Worker only (no D1 migration)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TEST_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.test.jsonc
      - name: Verify deployed TEST endpoints remain locked
        run: node tools/check-test-deployment.mjs
      - name: Exhaustively compare all 3,737 deployed TEST seats to approved manifest
        run: node tools/check-full-test-inventory.mjs
