name: Wheeling TEST Worker deployment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify isolated TEST config
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const c=JSON.parse(readFileSync('wrangler.test.jsonc','utf8'));
          if(c.name!=='wheeling-miners-store-test'||c.main!=='src/worker.js')throw Error('Wrong worker');
          if(c.vars?.WM_ENVIRONMENT!=='TEST'||c.vars?.SHOPIFY_STORE_DOMAIN!=='wheeling-miners-ticket-testing.myshopify.com'||c.vars?.SEAT_CONTROLLED_CART_ENABLED!=='true')throw Error('Wrong TEST vars');
          if(c.vars?.SEAT_PAID_FULFILLMENT_ENABLED==='true')throw Error('Fulfillment enabled');
          if(c.d1_databases?.length!==1||c.d1_databases[0].binding!=='SEAT_DB'||c.d1_databases[0].database_name!=='wheeling-miners-seats-test'||c.d1_databases[0].database_id!=='2a06b7a7-e833-4a01-8667-2f6388dc0ee0')throw Error('Wrong D1');
          JS
      - name: Check TEST database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TEST_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || exit 1
          test "$CLOUDFLARE_ACCOUNT_ID" = '0b83177a971bd8fcfad88ed4e531eb50' || exit 1
          npx --yes wrangler@4 d1 execute wheeling-miners-seats-test --remote --config wrangler.test.jsonc --command 'SELECT COUNT(*) FROM seats;'
          npx --yes wrangler@4 d1 execute wheeling-miners-seats-test --remote --config wrangler.test.jsonc --command 'SELECT COUNT(*) FROM reservations;'
          npx --yes wrangler@4 d1 execute wheeling-miners-seats-test --remote --config wrangler.test.jsonc --command 'SELECT COUNT(*) FROM reservation_seats;'
      - name: Deploy isolated TEST Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TEST_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || exit 1
          test "$CLOUDFLARE_ACCOUNT_ID" = '0b83177a971bd8fcfad88ed4e531eb50' || exit 1
          npx --yes wrangler@4 deploy --config wrangler.test.jsonc
      - name: Verify public routes locked
        run: |
          node --input-type=module <<'JS'
          const base='https://wheeling-miners-store-test.bikard.workers.dev';
          const r=await fetch(base+'/api/seats/status');const d=await r.json();
          if(!r.ok||d.checkout_enabled!==false||d.holds_enabled!==false)throw Error('Public checkout not locked');
          for(const p of ['/api/seats/hold','/api/seats/checkout']){
            const x=await fetch(base+p,{method:'POST',headers:{'content-type':'application/json'},body:'{}'});
            if(x.status!==423)throw Error(p+' not locked');
          }
          JS
